<title>Take Ownership</title>
<style>
  :root{
    --bg:#0d1117;--surface:#161b22;--surface2:#1d242e;--line:#2a323d;
    --text:#e8eaed;--muted:#8b949e;--muted2:#6b7280;
    --accent:#ff7a45;--accent-d:#3a1605;
    --cal:#ffb02e;--pro:#3ed9b0;--carb:#56a0ff;--fat:#c98bff;--water:#56a0ff;
    --good:#3ed9b0;--warn:#ffb02e;--bad:#ff5d5d;--r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;}
  body{overscroll-behavior-y:contain;}
  #app{max-width:540px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit;}
  input,select,textarea{font-family:inherit;font-size:16px;}
  a{color:var(--accent);}
  header{position:sticky;top:0;z-index:30;background:rgba(13,17,23,.94);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 11px) 16px 11px;display:flex;
    justify-content:space-between;align-items:flex-end;}
  .wm{font-size:10px;letter-spacing:2.5px;color:var(--accent);font-weight:800;}
  .h-title{font-size:20px;font-weight:800;margin-top:1px;}
  .h-date{font-size:11.5px;color:var(--muted);margin-top:1px;}
  .h-btn{background:var(--surface2);border:1px solid var(--line);border-radius:9px;
    width:38px;height:38px;font-size:17px;display:flex;align-items:center;justify-content:center;}
  main{padding:15px 15px 108px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:15px;margin-bottom:13px;}
  .card-t{font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
    color:var(--muted);margin:0 0 11px;}
  .row{display:flex;gap:9px;}.between{display:flex;justify-content:space-between;align-items:center;}
  .grow{flex:1;}.center{text-align:center;}.muted{color:var(--muted);}
  .small{font-size:13px;}.tiny{font-size:11.5px;}.mt8{margin-top:8px;}.mt12{margin-top:12px;}
  .hr{height:1px;background:var(--line);margin:13px 0;}
  .btn{background:var(--accent);color:var(--accent-d);font-weight:800;border-radius:11px;
    padding:13px 15px;font-size:15px;width:100%;text-align:center;}
  .btn:active{transform:scale(.985);}
  .btn.sec{background:var(--surface2);color:var(--text);border:1px solid var(--line);}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:700;}
  .btn.sm{padding:9px 12px;font-size:13px;width:auto;border-radius:9px;}
  .chip{background:var(--surface2);border:1px solid var(--line);border-radius:999px;
    padding:7px 13px;font-size:12.5px;font-weight:700;color:var(--muted);}
  .chip.on{background:var(--accent);color:var(--accent-d);border-color:var(--accent);}
  .coach{background:linear-gradient(135deg,#23170f,#1a1f29);border:1px solid #3a2a1c;
    border-radius:var(--r);padding:14px;margin-bottom:13px;}
  .coach-h{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;
    letter-spacing:1px;color:var(--accent);text-transform:uppercase;}
  .coach-b{margin-top:6px;font-size:14px;line-height:1.5;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;}
  .rings{display:flex;gap:6px;justify-content:space-around;}
  .ring-w{text-align:center;flex:1;}
  .ring{position:relative;width:104px;height:104px;margin:0 auto;}
  .ring svg{transform:rotate(-90deg);}
  .ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ring-v{font-size:21px;font-weight:800;line-height:1;}
  .ring-l{font-size:10.5px;color:var(--muted);margin-top:3px;}
  .ring-cap{font-size:11.5px;font-weight:700;margin-top:6px;}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .tile{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:11px;}
  .tile-v{font-size:19px;font-weight:800;}
  .tile-l{font-size:11px;color:var(--muted);margin-top:2px;}
  .mbar{height:9px;background:var(--surface2);border-radius:6px;overflow:hidden;}
  .mbar>i{display:block;height:100%;border-radius:6px;}
  .mline{display:flex;justify-content:space-between;font-size:12.5px;margin:9px 0 4px;}
  .pbar{height:10px;background:var(--surface2);border-radius:6px;overflow:hidden;}
  .pbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#ffb02e);}
  .ex{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:10px;}
  .ex-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .ex-n{font-weight:800;font-size:15px;}.ex-m{font-size:11.5px;color:var(--muted);}
  .set{display:flex;align-items:center;gap:7px;margin-top:8px;}
  .set-n{width:42px;font-size:11px;color:var(--muted);font-weight:700;}
  .inp{background:var(--surface2);border:1px solid var(--line);border-radius:9px;
    color:var(--text);padding:9px;width:100%;text-align:center;font-weight:700;}
  .inp::placeholder{color:var(--muted2);font-weight:500;}
  .set-f{flex:1;}.set-x{font-size:9.5px;color:var(--muted);text-align:center;margin-bottom:2px;}
  .ck{width:40px;height:38px;border-radius:9px;background:var(--surface2);
    border:1px solid var(--line);font-size:16px;display:flex;align-items:center;
    justify-content:center;flex-shrink:0;}
  .ck.on{background:var(--good);border-color:var(--good);color:#06281f;}
  .last{font-size:11px;color:var(--muted);background:var(--surface2);border-radius:6px;
    padding:3px 8px;display:inline-block;}
  .meal-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;
    font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:12px 0 5px;}
  .fitem{display:flex;justify-content:space-between;align-items:center;padding:9px 0;
    border-bottom:1px solid var(--line);}
  .fitem:last-child{border-bottom:none;}
  .fname{font-weight:700;font-size:14px;}.fsub{font-size:11.5px;color:var(--muted);margin-top:1px;}
  .fmac{text-align:right;font-size:12px;white-space:nowrap;}
  .del{color:var(--bad);background:none;font-size:17px;padding:0 2px 0 10px;}
  .step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .step button{width:30px;height:30px;background:var(--surface2);font-size:16px;font-weight:700;}
  .step .v{min-width:58px;text-align:center;font-size:12px;font-weight:800;}
  .sw{width:30px;height:30px;border-radius:8px;background:var(--surface2);
    border:1px solid var(--line);color:var(--pro);font-size:13px;}
  nav{position:fixed;bottom:0;left:0;right:0;z-index:30;max-width:540px;margin:0 auto;
    background:rgba(22,27,34,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);
    display:flex;padding-bottom:env(safe-area-inset-bottom);}
  .nav-i{flex:1;background:none;padding:8px 2px 7px;display:flex;flex-direction:column;
    align-items:center;gap:3px;color:var(--muted2);}
  .nav-i.on{color:var(--accent);}.nav-i svg{width:22px;height:22px;}
  .nav-l{font-size:9.5px;font-weight:700;}
  .ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.66);display:flex;
    align-items:flex-end;justify-content:center;}
  .sheet{background:var(--surface);width:100%;max-width:540px;border-radius:20px 20px 0 0;
    border-top:1px solid var(--line);padding:16px 16px calc(env(safe-area-inset-bottom) + 20px);
    max-height:90vh;overflow-y:auto;}
  .grip{width:36px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 13px;}
  .sheet-t{font-size:16px;font-weight:800;margin-bottom:13px;}
  .field{margin-bottom:12px;}
  .field label{font-size:12px;color:var(--muted);font-weight:700;display:block;margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;background:var(--surface2);
    border:1px solid var(--line);border-radius:9px;color:var(--text);padding:11px;}
  .seg{display:flex;gap:6px;flex-wrap:wrap;}
  .seg button{flex:1;min-width:64px;background:var(--surface2);border:1px solid var(--line);
    border-radius:9px;padding:10px 5px;font-size:12.5px;font-weight:700;color:var(--muted);}
  .seg button.on{background:var(--accent);color:var(--accent-d);border-color:var(--accent);}
  .auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:30px 26px;max-width:430px;margin:0 auto;}
  .auth-logo{font-size:12px;letter-spacing:3px;color:var(--accent);font-weight:800;}
  .auth-h{font-size:26px;font-weight:800;margin:7px 0 3px;}
  .empty{text-align:center;color:var(--muted);padding:24px 10px;font-size:13px;}
  .link{color:var(--accent);font-weight:700;background:none;padding:0;font-size:13px;}
  details{margin-top:9px;}summary{cursor:pointer;font-weight:700;padding:8px 0;font-size:13.5px;list-style:none;}
  summary::-webkit-details-marker{display:none;}
  summary:before{content:"+ ";color:var(--accent);font-weight:800;}
  details[open] summary:before{content:"– ";}
  .ref{font-size:13px;color:var(--muted);padding:3px 0 9px;}.ref b{color:var(--text);}
  .toast{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);background:var(--good);
    color:#06281f;font-weight:800;font-size:12.5px;padding:10px 17px;border-radius:10px;
    z-index:80;max-width:90%;box-shadow:0 8px 24px rgba(0,0,0,.4);}
  .foodrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;
    border-bottom:1px solid var(--line);}
  .pill{font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:5px;text-transform:uppercase;}
  .rd{width:17px;height:17px;border-radius:50%;border:1.5px solid #3a4250;display:inline-block;}
  .rd.on{background:var(--pro);border-color:var(--pro);}
  .gline{background:var(--surface2);border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;font-size:13px;margin-top:6px;}
  .verse{font-size:13.5px;line-height:1.55;color:#cdd3da;font-style:italic;}
  .splash{min-height:100vh;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:12px;color:var(--muted);}
  .spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:sp 1s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .timer{position:fixed;left:50%;transform:translateX(-50%);bottom:78px;z-index:60;
    background:var(--accent);color:var(--accent-d);font-weight:800;border-radius:12px;
    padding:11px 18px;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.45);}
  .savedpip{position:fixed;bottom:80px;right:14px;background:var(--good);color:#06281f;
    font-weight:800;font-size:10px;letter-spacing:.6px;padding:4px 11px;border-radius:999px;
    z-index:78;box-shadow:0 4px 14px rgba(0,0,0,.4);}
  .jnav{background:var(--surface2);border:1px solid var(--line);border-radius:10px;
    width:42px;height:42px;font-size:21px;font-weight:800;color:var(--text);flex-shrink:0;}
  .jnav:active{transform:scale(.95);}
</style>
</head>

/* ---------- TDEE / TARGETS ---------- */
function calcTDEE(p){
 var kg=p.weightLbs*0.453592,cm=p.heightIn*2.54;
 var bmr=10*kg+6.25*cm-5*p.age+(p.sex==="female"?-161:5);
 var m={sedentary:1.2,light:1.375,moderate:1.55,very:1.725,extra:1.9}[p.activity]||1.55;
 return Math.round(bmr*m/10)*10;}
function targets(){
 var p=DB.profile;if(!p)return{cal:0,protein:0,maint:0,water:128};
 var maint=(DB.calibration&&DB.calibration.maintenance)?DB.calibration.maintenance
   :(p.manualMaintenance?p.manualMaintenance:calcTDEE(p));
 var cal=Math.round((maint+(DB.settings.calAdj||0))/10)*10;
 var pw=p.weightLbs;
 if(p.goalWeight&&(p.weightLbs-p.goalWeight)>50)pw=p.goalWeight;
 return{cal:cal,protein:Math.round(pw),maint:maint,water:DB.settings.waterGoalOz||128};}

function dayTotals(k){var t={cal:0,p:0,c:0,f:0},fd=day(k).food,i;
 for(i=0;i<fd.length;i++){t.cal+=fd[i].cal;t.p+=fd[i].p;t.c+=fd[i].c||0;t.f+=fd[i].f||0;}return t;}

 return Math.round(sum/last7.length*10)/10;}

var localWasNewer=false;
function loadAll(cb){
 var done=0,need=2,failed=false;
 function step(){done++;if(done>=need)cb(failed);}
 localWasNewer=false;
 sb.from("app_state").select("data").eq("user_id",USER.id).maybeSingle()
  .then(function(res){
    if(res.error){failed=true;}
    else{
     var cloud=(res.data&&res.data.data)?res.data.data:null;
     var cp=peekCache(),cdb=(cp&&cp.DB)?cp.DB:null;
     if(cdb&&cdb.updatedAt&&(!cloud||!cloud.updatedAt||cdb.updatedAt>cloud.updatedAt)){
      DB=Object.assign(newDB(),cdb);localWasNewer=!!cloud;
     }else if(cloud){DB=Object.assign(newDB(),cloud);}
     else{DB=newDB();}
    }
    step();
  }).catch(function(){failed=true;step();});
 sb.from("weights").select("day,lbs,source").eq("user_id",USER.id)
  .then(function(res){if(!res.error&&res.data)WEIGHTS=res.data.map(function(w){return{day:w.day,lbs:Math.round((w.lbs||0)*100)/100,source:w.source};});step();})
  .catch(function(){step();});
}

function bumpActivity(){
 lastAct=Date.now();
 if(lastAct-actSaved<5000)return;
 actSaved=lastAct;
 try{localStorage.setItem("to_lastact",String(lastAct));
  localStorage.setItem("to_logoutmin",String((DB.settings&&DB.settings.autoLogoutMin)||30));}catch(e){}
}
function startActivityWatch(){
 if(!actWired){actWired=true;
  ["click","keydown","touchstart","scroll"].forEach(function(ev){
   document.addEventListener(ev,bumpActivity,{passive:true});});}
 if(logoutInt)clearInterval(logoutInt);
 logoutInt=setInterval(function(){
  if(!USER)return;
  var mins=(DB.settings&&DB.settings.autoLogoutMin)||30;
  if(Date.now()-lastAct>mins*60000){toast("Signed out — inactive for "+mins+" min.");signOut();}
 },20000);

}
function sessionStale(){
 try{var la=parseInt(localStorage.getItem("to_lastact")||"0",10);
  var lm=parseInt(localStorage.getItem("to_logoutmin")||"30",10);
  if(la&&(Date.now()-la)>lm*60000)return true;}catch(e){}
 return false;
}

/* ---------- FACE ID (WebAuthn) for the journal ---------- */
function b64u(buf){var s="",a=new Uint8Array(buf),i;for(i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);
 return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}
function unb64u(str){str=str.replace(/-/g,"+").replace(/_/g,"/");while(str.length%4)str+="=";
 var b=atob(str),u=new Uint8Array(b.length),i;for(i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer;}
function faceAvailable(){return !!(window.PublicKeyCredential&&navigator.credentials&&window.isSecureContext&&window.crypto&&crypto.getRandomValues);}
function setupFaceId(){
 if(!faceAvailable()){toast("Face ID isn't available on this device.");return;}
 if(!DB.settings.journalPin){toast("Set a passcode first — it's your backup — then enable Face ID.");return;}
 var ch=new Uint8Array(32);crypto.getRandomValues(ch);
 var uib=new Uint8Array(16);crypto.getRandomValues(uib);
 navigator.credentials.create({publicKey:{challenge:ch,rp:{name:"Take Ownership"},
  user:{id:uib,name:(USER&&USER.email)||"journal",displayName:"Journal"},
  pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
  authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required"},
  timeout:60000,attestation:"none"}})
 .then(function(cred){DB.settings.journalFaceId=true;DB.settings.journalCredId=b64u(cred.rawId);
  save();closeModal();render();toast("Face ID enabled for your journal.");})
 .catch(function(){toast("Couldn't set up Face ID. Your passcode still works.");});
}
function disableFaceId(){DB.settings.journalFaceId=false;DB.settings.journalCredId=null;
 save();closeModal();render();toast("Face ID removed — passcode still set.");}
function unlockFace(){
 if(!DB.settings.journalCredId){toast("Face ID not set up.");return;}
 var ch=new Uint8Array(32);crypto.getRandomValues(ch);
 navigator.credentials.get({publicKey:{challenge:ch,
  allowCredentials:[{type:"public-key",id:unb64u(DB.settings.journalCredId)}],
  userVerification:"required",timeout:60000}})
 .then(function(){state.journalUnlocked=true;state.faceFallback=false;render();})
 .catch(function(){toast("Face ID didn't match — use your passcode.");state.faceFallback=true;render();});
}

function prevWorkoutSets(name,beforeKey){

  var w=DB.days[ks[i]].workout;if(!w||!w.ex)continue;

   if(w.ex[j].name!==name)continue;

   for(x=0;x<src.length;x++){if(src[x].weight!=null||src[x].reps!=null){has=true;break;}}

var POOLS={
 bP:["egg","egg_white","greek_yogurt","whey","turkey_bacon","cottage_cheese"],
 bC:["banana","sourdough","apple","potato","oats"],
 mP:["chicken_breast","chicken_thigh","ground_beef","ground_turkey","sirloin","salmon","shrimp","tuna","ny_strip","pork_loin","cod","bison","venison"],
 mC:["white_rice","potato","sweet_potato","tortilla","sourdough"],
 fat:["olive_oil","avocado_oil","butter"],
 veg:["broccoli","green_beans","asparagus","bell_pepper","carrot","spinach","cabbage"],
 sP:["whey","greek_yogurt","cottage_cheese"],
 sX:["almonds","mixed_nuts","sunflower_seeds","banana","apple","berries"]
};
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function roundAmt(f,x){
 if(f.unit==="oz")return Math.max(2,Math.round(x*2)/2);
 if(f.unit==="g")return Math.max(20,Math.round(x/10)*10);
 var st=f.step||1;return Math.max(st,Math.round(x/st)*st);}
var CO={protein:0,carb:1,veg:2,fat:3};
function buildPlanMeal(name,share,t,split){
 var mP=t.protein*share,mF=split.fat*share,mC=split.carb*share;
 var snack=(name==="Snack"),bf=(name==="Breakfast"),items=[],acc={cal:0,p:0,c:0,f:0};
 function add(f,amt){items.push({foodId:f.id,amt:amt});var m=macrosFor(f,amt);
  acc.cal+=m.cal;acc.p+=m.p;acc.c+=m.c;acc.f+=m.f;}
 if(snack){
  var sx=foodById(pick(POOLS.sX));
  if(sx.cat==="fat")add(sx,roundAmt(sx,Math.max(20,(mF*0.6)/perUnit(sx).f)));else add(sx,roundAmt(sx,sx.ref));
  var sp=foodById(pick(POOLS.sP));add(sp,roundAmt(sp,(mP-acc.p)/perUnit(sp).p));
 }else{
  var cf=foodById(pick(bf?POOLS.bC:POOLS.mC));add(cf,roundAmt(cf,mC/perUnit(cf).c));
  if(name==="Lunch"||name==="Dinner")add(foodById(pick(POOLS.veg)),150);
  var pf=foodById(pick(bf?POOLS.bP:POOLS.mP));add(pf,roundAmt(pf,(mP-acc.p)/perUnit(pf).p));
  var gap=mF-acc.f;if(gap>4){var ff=foodById(pick(POOLS.fat));add(ff,roundAmt(ff,gap/perUnit(ff).f));}
 }
 items.sort(function(a,b){return CO[foodById(a.foodId).cat]-CO[foodById(b.foodId).cat];});
 return{name:name,items:items,totals:acc};
}
function genPlan(){
 var t=targets(),fatG=Math.round(t.cal*0.28/9);
 var carbG=Math.max(0,Math.round((t.cal-t.protein*4-fatG*9)/4));
 var split={fat:fatG,carb:carbG};
 var meals=DB.settings.mealsPerDay===3?[["Breakfast",.3],["Lunch",.36],["Dinner",.34]]
  :[["Breakfast",.26],["Lunch",.3],["Dinner",.3],["Snack",.14]];
 var plan={date:todayKey(),meals:[],split:split};
 meals.forEach(function(m){plan.meals.push(buildPlanMeal(m[0],m[1],t,split));});
 return plan;
}

function genWeekPlan(){
 var t=targets(),fatG=Math.round(t.cal*0.28/9);
 var carbG=Math.max(0,Math.round((t.cal-t.protein*4-fatG*9)/4)),split={fat:fatG,carb:carbG};
 var dn=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
 var mealsDef=DB.settings.mealsPerDay===3?[["Breakfast",.3],["Lunch",.36],["Dinner",.34]]
  :[["Breakfast",.26],["Lunch",.3],["Dinner",.3],["Snack",.14]];
 var days=[];
 for(var i=0;i<7;i++){var meals=[];
  mealsDef.forEach(function(m){meals.push(buildPlanMeal(m[0],m[1],t,split));});
  days.push({day:dn[i],meals:meals});}
 return{week:keyOf(weekStart(new Date())),days:days};
}
function shoppingList(wp){
 var map={};
 wp.days.forEach(function(d){d.meals.forEach(function(m){m.items.forEach(function(it){
  if(!map[it.foodId])map[it.foodId]=0;map[it.foodId]+=it.amt;});});});
 var out=[];
 for(var id in map){var f=foodById(id);if(!f)continue;
  var qty,total=map[id];
  if(f.unit==="oz")qty=(total>=16?r1(total/16)+" lb":Math.round(total)+" oz");
  else if(f.unit==="g")qty=(total>=454?r1(total/454)+" lb":Math.round(total)+" g");
  else qty=Math.round(total)+" "+(f.un||"servings")+(total!==1?"s":"");
  out.push({cat:f.cat,name:f.name,qty:qty});}
 return out;
}

 if(j.notes&&j.notes.trim())return true;

 else if(j.gratitude){for(i=0;i<j.gratitude.length;i++){if(j.gratitude[i]&&j.gratitude[i].trim()){s="Grateful: "+j.gratitude[i].trim();break;}}}

function weightChart(){
 var s=sortedWeights();
 if(s.length<2)return '<div class="tiny muted center" style="padding:14px 0">Log your weight a few times to see your trend.</div>';
 var W=480,H=120,pad=10,ws=s.map(function(x){return x.lbs;});
 var mn=Math.min.apply(null,ws),mx=Math.max.apply(null,ws);if(mn===mx){mn-=2;mx+=2;}
 var pl=s.map(function(x,i){var px=pad+i/(s.length-1)*(W-pad*2);
  var py=pad+(1-(x.lbs-mn)/(mx-mn))*(H-pad*2);return px.toFixed(1)+","+py.toFixed(1);});
 var dots="";pl.forEach(function(c){var xy=c.split(",");
  dots+='<circle cx="'+xy[0]+'" cy="'+xy[1]+'" r="3" fill="var(--accent)"/>';});
 var delta=Math.round((s[s.length-1].lbs-s[0].lbs)*10)/10;
 return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+
  '<polyline points="'+pl.join(" ")+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>'+dots+'</svg>'+
  '<div class="between" style="margin-top:5px"><span class="tiny muted">'+s[0].day+': '+s[0].lbs+'</span>'+
  '<span class="tiny" style="color:'+(delta<=0?"var(--good)":"var(--warn)")+';font-weight:700">'+(delta>0?"+":"")+delta+' lb</span>'+
  '<span class="tiny muted">trend '+(trendWeight()||"—")+'</span></div>';
}
function getStrength(){
 var first={},last={},k,j;
 var ks=Object.keys(DB.days).sort();
 ks.forEach(function(k){var w=DB.days[k].workout;if(!w||!w.ex||w.custom)return;
  w.ex.forEach(function(e){if(e.failure)return;var best=0;
   e.sets.forEach(function(s){if(s.weight>best)best=s.weight;});
   if(best>0){if(!first[e.name])first[e.name]=best;last[e.name]=best;}});});
 var out=[];for(var n in last){if(first[n]!=null)out.push({name:n,first:first[n],last:last[n],gain:Math.round((last[n]-first[n])*10)/10});}
 return out.slice(0,6);
}
function getWins(){
 var w=[],s=getStrength();
 s.forEach(function(x){if(x.gain>=10)w.push(x.name+" up "+x.gain+" lb");});
 var sw=sortedWeights();
 if(sw.length>=4){var d=Math.round((sw[sw.length-1].lbs-sw[0].lbs)*10)/10;
  if(d<=-2)w.push("Body weight down "+Math.abs(d)+" lb");}
 if(workoutDates().length>=12)w.push(workoutDates().length+" workouts banked — consistency compounding");
 return w.slice(0,4);
}
function proteinAdherence(){
 var t=targets(),hit=0,tr=0,i;
 for(i=0;i<7;i++){var dd=new Date();dd.setDate(dd.getDate()-i);var k=keyOf(dd);
  var l=DB.days[k];if(l&&l.food&&l.food.length){tr++;if(dayTotals(k).p>=t.protein*0.9)hit++;}}
 return tr?Math.round(hit/tr*100):0;
}
function calibrateNow(){
 var s=sortedWeights();
 if(s.length<10){toast("Log weight + food for ~2-3 weeks first.");return;}
 var span=daysBetween(s[0].day,s[s.length-1].day);
 if(span<10){toast("Need a longer weight history to calibrate.");return;}
 var wChange=s[s.length-1].lbs-s[0].lbs;
 var calDays=0,calSum=0,k;
 for(k in DB.days){if(k>=s[0].day&&DB.days[k].food&&DB.days[k].food.length){calDays++;calSum+=dayTotals(k).cal;}}
 if(calDays<7){toast("Log food more consistently to calibrate.");return;}
 var avgIntake=calSum/calDays;
 var maint=Math.round((avgIntake-(wChange*3500/span))/10)*10;
 if(maint<1200||maint>5000){toast("Not enough clean data yet — keep logging.");return;}
 DB.calibration={maintenance:maint,lastRun:todayKey()};save();render();
 toast("Maintenance recalibrated to "+maint+" cal from your real trend.");
}

 ["waist","chest","arm","thigh"].forEach(function(f){
  var v=parseFloat(document.getElementById("me-"+f).value);if(!isNaN(v)){m[f]=v;any=true;}});
 if(!any){toast("Enter at least one measurement.");return;}
 if(!DB.measurements)DB.measurements=[];
 DB.measurements=DB.measurements.filter(function(x){return x.day!==todayKey();});
 DB.measurements.push(m);save();closeModal();render();toast("Measurements logged.");
}

function settingsSheet(){
 var s=DB.settings;
 var h='<div class="grip"></div><div class="sheet-t">App Settings</div>';
 h+='<div class="field"><label>Meals per day (for meal plans)</label>'+
  '<select id="set-meals"><option value="3"'+(s.mealsPerDay===3?" selected":"")+'>3</option>'+
  '<option value="4"'+(s.mealsPerDay===4?" selected":"")+'>4</option></select></div>';
 h+='<div class="field"><label>Water goal (oz/day)</label><input id="set-water" type="number" inputmode="numeric" value="'+(s.waterGoalOz||128)+'"></div>';
 h+='<div class="field"><label>Auto sign-out after inactivity</label><select id="set-logout">'+
  [15,30,60,120].map(function(m){var lbl=m<60?(m+" minutes"):(m===60?"1 hour":"2 hours");
   return '<option value="'+m+'"'+(((s.autoLogoutMin||30)===m)?" selected":"")+'>'+lbl+'</option>';}).join("")+
  '</select></div>';
 h+='<div class="hr"></div><div class="card-t">Journal Lock</div>';
 h+='<div class="field"><label>Passcode (blank = no lock)</label>'+
  '<input id="set-pin" type="text" inputmode="numeric" maxlength="8" value="'+esc(s.journalPin)+'" placeholder="e.g. 1234"></div>';
 if(faceAvailable()){
  if(s.journalFaceId)h+='<button class="btn sec" style="width:100%;margin-bottom:6px" onclick="disableFaceId()">Face ID is ON — tap to remove</button>';
  else h+='<button class="btn sec" style="width:100%;margin-bottom:6px" onclick="setupFaceId()">Enable Face ID unlock (this device)</button>';
  h+='<div class="tiny muted" style="margin-bottom:12px">Face ID unlocks the journal on this device; your passcode always works as backup.</div>';
 }else h+='<div class="tiny muted" style="margin-bottom:12px">Face ID unlock isn\'t supported here — passcode lock still works.</div>';
 h+='<button class="btn" onclick="saveSettings()">Save settings</button>';
 h+='<button class="btn ghost mt8" onclick="closeModal()">Cancel</button>';
 openSheet(h);
}
function saveSettings(){
 DB.settings.mealsPerDay=parseInt(document.getElementById("set-meals").value);
 DB.settings.waterGoalOz=parseInt(document.getElementById("set-water").value)||128;
 DB.settings.autoLogoutMin=parseInt(document.getElementById("set-logout").value)||30;
 var pin=document.getElementById("set-pin").value.trim();
 DB.settings.journalPin=pin||null;
 if(!pin){state.journalUnlocked=false;DB.settings.journalFaceId=false;DB.settings.journalCredId=null;}
 bumpActivity();save();closeModal();render();toast("Settings saved.");
}
function editProfileSheet(){

 h+='<div class="field"><label>Name</label><input id="p-name" value="'+esc(p.name)+'"></div>';
 h+='<div class="row"><div class="field grow"><label>Age</label><input id="p-age" type="number" value="'+p.age+'"></div>'+
  '<div class="field grow"><label>Weight (lbs)</label><input id="p-weight" type="number" inputmode="decimal" value="'+p.weightLbs+'"></div></div>';

  '<div class="field grow"><label>Height in</label><input id="p-in" type="number" value="'+inch+'"></div></div>';
 h+='<div class="field"><label>Activity</label><select id="p-act">'+
  ['sedentary','light','moderate','very','extra'].map(function(a){
   return '<option value="'+a+'"'+(p.activity===a?" selected":"")+'>'+a+'</option>';}).join("")+'</select></div>';
 h+='<div class="field"><label>Calorie adjustment vs maintenance</label><select id="p-adj">'+
  [["-500","-500 cut"],["-300","-300 cut"],["-250","-250 recomp/lean"],["0","0 maintain"],["300","+300 gain"],["500","+500 gain"]]
   .map(function(o){return '<option value="'+o[0]+'"'+(DB.settings.calAdj==o[0]?" selected":"")+'>'+o[1]+'</option>';}).join("")+'</select></div>';
 h+='<div class="field"><label>Maintenance override (blank = auto)</label><input id="p-mm" type="number" value="'+(p.manualMaintenance||"")+'"></div>';
 h+='<button class="btn" onclick="saveProfile()">Save</button>';
 h+='<button class="btn ghost mt8" onclick="closeModal()">Cancel</button>';
 openSheet(h);

function saveProfile(){
 var p=DB.profile;
 p.name=document.getElementById("p-name").value.trim();
 p.age=parseInt(document.getElementById("p-age").value)||p.age;
 p.weightLbs=parseFloat(document.getElementById("p-weight").value)||p.weightLbs;
 var ft=parseInt(document.getElementById("p-ft").value)||0,inch=parseInt(document.getElementById("p-in").value)||0;
 if(ft>0)p.heightIn=ft*12+inch;
 p.activity=document.getElementById("p-act").value;
 DB.settings.calAdj=parseInt(document.getElementById("p-adj").value);
 var mm=parseFloat(document.getElementById("p-mm").value);
 p.manualMaintenance=isNaN(mm)?null:mm;
 save();closeModal();render();toast("Profile updated.");
}

function exportData(){
 var blob=new Blob([JSON.stringify({DB:DB,WEIGHTS:WEIGHTS},null,2)],{type:"application/json"});
 var url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download="take-ownership-backup-"+todayKey()+".json";
 document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
 toast("Backup downloaded.");
}

/* ---------- PULL TO REFRESH ---------- */
var ptY0=0,ptOn=false,ptDist=0;
function ptShow(d){
 var el=document.getElementById("ptbar");if(!el)return;
 if(d<=4){el.innerHTML="";return;}
 el.innerHTML='<div style="position:fixed;top:0;left:0;right:0;text-align:center;padding:'+
  Math.round(Math.min(d/2,42))+'px 0 8px;font-size:12px;font-weight:800;color:var(--accent);z-index:70;pointer-events:none">'+
  (d>70?"Release to refresh":"Pull to refresh")+'</div>';
}
function doRefresh(){
 var el=document.getElementById("ptbar");
 if(!USER){location.reload();return;}
 if(el)el.innerHTML='<div style="position:fixed;top:0;left:0;right:0;text-align:center;padding:16px 0 8px;font-size:12px;font-weight:800;color:var(--accent);z-index:70">Refreshing…</div>';
 loadAll(function(failed){
  if(el)el.innerHTML="";
  if(failed)toast("Couldn't reach the server.");
  else{render();toast("Refreshed.");}
 });
}
document.addEventListener("touchstart",function(e){
 var m=document.getElementById("modal");
 ptOn=(window.scrollY<=0&&(!m||!m.innerHTML)&&!!USER);
 ptY0=e.touches[0].clientY;ptDist=0;
},{passive:true});
document.addEventListener("touchmove",function(e){
 if(!ptOn)return;
 ptDist=e.touches[0].clientY-ptY0;
 ptShow(ptDist>0&&window.scrollY<=0?ptDist:0);
},{passive:true});
document.addEventListener("touchend",function(){
 if(ptOn&&ptDist>70)doRefresh();else ptShow(0);
 ptOn=false;ptDist=0;
},{passive:true});

function checkUpdate(){
 try{fetch(location.pathname+"?cb="+Date.now(),{cache:"no-store"})
  .then(function(r){return r.text();})
  .then(function(h){var m=h.match(/APP_VERSION="([0-9.]+)"/);
   if(m&&m[1]&&m[1]!==APP_VERSION)location.replace(location.pathname+"?v="+m[1]);})
  .catch(function(){});}catch(e){}
}
checkUpdate();
boot();
